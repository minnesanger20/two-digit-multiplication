<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>2けた×2けたのひっさん</title>
<style>
*{box-sizing:border-box;touch-action:none;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eaf5ff;font-family:"Hiragino Sans","Yu Gothic",sans-serif;color:#172334}button{font-family:inherit}#app{position:relative;width:100%;height:100%}.screen{position:absolute;inset:0;display:none}.screen.show{display:flex}
#title{align-items:center;justify-content:center;flex-direction:column;background:linear-gradient(150deg,#e4f6ff,#fff8d8);gap:24px}.titleText{font-size:clamp(34px,6vw,68px);font-weight:900;letter-spacing:.04em}.levels{display:grid;grid-template-columns:repeat(2,minmax(180px,280px));gap:20px}.level{height:100px;border:0;border-radius:24px;font-size:clamp(28px,4vw,42px);font-weight:900;color:#17324c;background:#fff;border:5px solid #65a9dc;box-shadow:0 8px 0 #3775a5}.level:active{transform:translateY(5px);box-shadow:0 3px 0 #3775a5}
#game{display:none;padding:8px;grid-template-columns:minmax(0,1fr) 170px;gap:9px}.show#game{display:grid}#board{position:relative;overflow:hidden;background:#fff;border:4px solid #65a9dc;border-radius:20px;box-shadow:0 5px 0 #3775a5}#ink{position:absolute;inset:0;z-index:1;pointer-events:none}#sum{position:absolute;z-index:2;left:50%;top:45%;transform:translate(-50%,-50%);display:grid;grid-template-columns:repeat(5,clamp(64px,8.5vw,100px));grid-template-rows:78px 78px 38px 71px 64px 38px 73px;align-items:center;justify-items:center;font-size:clamp(46px,6.8vw,72px);font-weight:800;line-height:1}.cell{position:relative;z-index:2;width:100%;height:100%;display:flex;align-items:center;justify-content:center;border-radius:14px}.op{font-size:.78em}.bar{width:100%;height:7px;border-radius:5px;background:#172334;align-self:center}.slot{width:88%;height:84%;background:#fff;border:4px solid #a9d8f5;border-radius:12px;box-shadow:inset 0 2px 4px #d9e7ef;color:#172334;font-size:.86em}.slot.active{background:#fff2a6;border-color:#ff9f1c;animation:pulse .8s alternate infinite}.slot.done{background:#eafaf0;border-color:#52a86d}.slot.wrong{color:#2573c2;border-color:#2573c2;animation:shake .25s}.num.focus{background:transparent}.free .slot{border-color:#a9d8f5;background:#fff}.free .slot.active{animation:none}.free #pairGlow{display:none}@keyframes pulse{to{transform:scale(1.04);box-shadow:0 0 0 7px #ffd43b44}}@keyframes shake{25%{transform:translateX(-12px)}75%{transform:translateX(12px)}}#pairGlow{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:visible}#pairGlow line{stroke:#ffe36e;stroke-width:54;stroke-linecap:round;opacity:.78}
#side{z-index:5;background:#f8fcff;border:4px solid #65a9dc;border-radius:20px;box-shadow:0 5px 0 #3775a5;padding:9px;display:flex;flex-direction:column;align-items:center;gap:8px}#progress{font-size:24px;font-weight:900;white-space:nowrap}#digits{display:grid;grid-template-columns:repeat(2,62px);gap:7px}.digit{width:62px;height:48px;border:2px solid #9bc6e4;border-radius:11px;background:#fff;font-size:33px;font-weight:900;color:#172334;box-shadow:0 4px 0 #789db7}.digit:active{transform:translateY(3px);box-shadow:0 1px 0 #789db7}#tools{margin-top:auto;width:100%;display:grid;grid-template-columns:1fr 1fr;gap:8px}.tool{height:50px;border:0;border-radius:12px;background:#dcecf7;font-size:24px;font-weight:900;box-shadow:0 4px 0 #92adbf}.tool.on{background:#ffd43b;box-shadow:0 4px 0 #dfad00}#clear{grid-column:1/3}#ghost{display:none;position:fixed;z-index:60;width:68px;height:68px;transform:translate(-50%,-50%);align-items:center;justify-content:center;border-radius:50%;background:#fff8bd;border:4px solid #ff9f1c;font-size:44px;font-weight:900;pointer-events:none;box-shadow:0 7px 16px #0004}#mark{display:none;position:absolute;inset:0;z-index:50;align-items:center;justify-content:center;background:#ffffffc9;font-size:min(43vw,43vh);font-weight:900}.red{color:#e32636}.blue{color:#2874c6}
#finish{align-items:center;justify-content:center;flex-direction:column;background:linear-gradient(145deg,#fff7ca,#dff7ff);gap:24px}.clearText{font-size:clamp(52px,10vw,110px);font-weight:900;color:#ef233c}.results{display:flex;gap:18px}.resultCircle{width:clamp(58px,9vw,92px);height:clamp(58px,9vw,92px);border:clamp(8px,1.1vw,13px) solid currentColor;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:clamp(22px,3vw,32px);font-weight:900;background:#fff}.home{height:70px;min-width:220px;border:0;border-radius:18px;background:#fff;border:4px solid #65a9dc;box-shadow:0 6px 0 #3775a5;font-size:30px;font-weight:900;color:#17324c}
@media(max-width:720px){#game{grid-template-columns:minmax(0,1fr) 145px;padding:5px;gap:6px}#side{padding:6px}#digits{grid-template-columns:repeat(2,54px)}.digit{width:54px;height:42px;font-size:29px}#sum{grid-template-columns:repeat(5,58px);grid-template-rows:66px 66px 30px 61px 55px 30px 64px;font-size:42px}.levels{grid-template-columns:repeat(2,170px)}.level{height:84px}}
</style></head><body><div id="app">
<section id="title" class="screen show"><div class="titleText">2けた×2けたのひっさん</div><div class="levels"><button class="level" data-level="1">レベル 1</button><button class="level" data-level="2">レベル 2</button><button class="level" data-level="3">レベル 3</button><button class="level" data-level="4">レベル 4</button></div></section>
<section id="game" class="screen"><main id="board"><canvas id="ink"></canvas><div id="sum"></div></main><aside id="side"><div id="progress"></div><div id="digits"></div><div id="tools"><button id="pen" class="tool on" type="button">✏️</button><button id="eraser" class="tool" type="button">▱</button><button id="clear" class="tool" type="button">↶</button></div></aside></section>
<div id="ghost"></div><div id="mark">〇</div><section id="finish" class="screen"><div class="clearText">クリア！</div><div id="results" class="results"></div><button id="home" class="home" type="button">もどる</button></section></div>
<script>
(()=>{const $=s=>document.querySelector(s),title=$('#title'),game=$('#game'),finish=$('#finish'),board=$('#board'),sum=$('#sum'),cv=$('#ink'),cx=cv.getContext('2d'),ghost=$('#ghost');let level=1,qi=0,stage=0,mode='pen',drawing=false,last=null,drag=null,wrong=false,records=[],questions=[],groups=[],allSlots=[];
const pools={3:[],4:[]};
function rowHasCarry(a,d){return (a%10)*d>=10}
for(let a=10;a<=99;a++)for(let b=10;b<=99;b++){let p=a*b;if(p<1000){pools[3].push([a,b])}else if(rowHasCarry(a,b%10)&&rowHasCarry(a,Math.floor(b/10))){pools[4].push([a,b])}}
function pick(kind){let pool=[...pools[kind]];for(let i=pool.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}return pool.slice(0,5)}
function show(el){[title,game,finish].forEach(x=>x.classList.remove('show'));el.classList.add('show')}document.querySelectorAll('.level').forEach(b=>b.onclick=()=>start(+b.dataset.level));$('#home').onclick=()=>{show(title);clearInk()};
function start(n){level=n;qi=0;records=[];questions=pick(n===1||n===3?3:4);game.classList.toggle('free',n>=3);show(game);build()}
function add(c,r,t='',cl='cell'){let e=document.createElement('div');e.className=cl;e.style.gridColumn=c;e.style.gridRow=r;e.textContent=t;sum.appendChild(e);return e}function slot(c,r,a){let e=add(c,r,'','cell slot');e.dataset.answer=a;allSlots.push(e);return e}
function addNumberSlots(value,row,rightCol){let ds=String(value).split('');let arr=[];let start=rightCol-ds.length+1;ds.forEach((d,i)=>arr.push(slot(start+i,row,d)));return arr}
function build(){wrong=false;stage=0;groups=[];allSlots=[];sum.innerHTML='';let[a,b]=questions[qi],at=add(4,1,Math.floor(a/10),'cell num'),ao=add(5,1,a%10,'cell num'),bt=add(4,2,Math.floor(b/10),'cell num'),bo=add(5,2,b%10,'cell num');add(3,2,'×','cell op');let bar1=add(1,3,'','bar');bar1.style.gridColumn='1/6';let r1=addNumberSlots(a*(b%10),4,5),r2=addNumberSlots(a*Math.floor(b/10),5,4);let bar2=add(1,6,'','bar');bar2.style.gridColumn='1/6';let ans=addNumberSlots(a*b,7,5);
if(level===2){
  let rr1=r1.slice().reverse(), rr2=r2.slice().reverse();
  groups=[
    {s:rr1.slice(0,1),n:[ao,bo]},
    {s:rr1.slice(1),n:[at,bo]},
    {s:rr2.slice(0,1),n:[ao,bt]},
    {s:rr2.slice(1),n:[at,bt]},
    {s:ans,n:[]}
  ];activate()
}else if(level===1){groups=[{s:r1.slice().reverse(),n:[ao,bo]},{s:r2.slice().reverse(),n:[ao,bt]},{s:ans,n:[]}];activate()}else{groups=[{s:allSlots,n:[]}]}$('#progress').textContent=`レベル${level}　${qi+1} / 5`;clearInk();resize()}
function activate(){document.querySelectorAll('.active,.focus').forEach(e=>e.classList.remove('active','focus'));sum.querySelectorAll('#pairGlow').forEach(e=>e.remove());let g=groups[stage];if(!g)return;g.s.filter(e=>!e.classList.contains('done')).forEach(e=>e.classList.add('active'));g.n.forEach(e=>e.classList.add('focus'));drawGlow(g.n)}
function drawGlow(ns){sum.querySelectorAll('#pairGlow').forEach(e=>e.remove());if(ns.length<2)return;let sr=sum.getBoundingClientRect(),a=ns[0].getBoundingClientRect(),b=ns[1].getBoundingClientRect(),svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.id='pairGlow';svg.setAttribute('width',sr.width);svg.setAttribute('height',sr.height);svg.setAttribute('viewBox',`0 0 ${sr.width} ${sr.height}`);let l=document.createElementNS('http://www.w3.org/2000/svg','line');l.setAttribute('x1',a.left-sr.left+a.width/2);l.setAttribute('y1',a.top-sr.top+a.height/2);l.setAttribute('x2',b.left-sr.left+b.width/2);l.setAttribute('y2',b.top-sr.top+b.height/2);svg.appendChild(l);sum.prepend(svg)}
function makeDigits(){for(let i=0;i<10;i++){let b=document.createElement('button');b.type='button';b.className='digit';b.textContent=i;b.dataset.n=i;b.addEventListener('pointerdown',dragStart);$('#digits').appendChild(b)}}function dragStart(e){drag=e.currentTarget.dataset.n;ghost.textContent=drag;ghost.style.display='flex';dragMove(e);e.currentTarget.setPointerCapture?.(e.pointerId);e.currentTarget.addEventListener('pointermove',dragMove);e.currentTarget.addEventListener('pointerup',dragEnd,{once:true});e.currentTarget.addEventListener('pointercancel',dragEnd,{once:true})}function dragMove(e){ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px'}
function dragEnd(e){e.currentTarget.removeEventListener('pointermove',dragMove);ghost.style.display='none';let t=document.elementFromPoint(e.clientX,e.clientY)?.closest('.slot');if(t&&!t.classList.contains('done')&&canUse(t)){t.textContent=drag;if(t.dataset.answer===drag){t.classList.add('done');t.classList.remove('active','wrong');advance()}else{wrong=true;t.classList.add('wrong');setTimeout(()=>{t.textContent='';t.classList.remove('wrong')},320)}}drag=null}
function canUse(t){if(level>=3)return allSlots.includes(t);let g=groups[stage];return g.s.includes(t)&&!t.classList.contains('done')}function advance(){if(allSlots.every(x=>x.classList.contains('done')))return complete();if(level>=3)return;let g=groups[stage];if(g.s.every(x=>x.classList.contains('done')))stage++;activate()}
function complete(){records.push(!wrong);document.querySelectorAll('.focus').forEach(e=>e.classList.remove('focus'));$('#pairGlow')?.remove();let m=$('#mark');m.className=wrong?'blue':'red';m.style.display='flex';setTimeout(()=>{m.style.display='none';qi++;qi>=5?showFinish():build()},950)}function showFinish(){show(finish);let r=$('#results');r.innerHTML='';records.forEach((ok,i)=>{let c=document.createElement('div');c.className='resultCircle '+(ok?'red':'blue');c.textContent=i+1;r.appendChild(c)})}
function resize(){let r=board.getBoundingClientRect(),d=devicePixelRatio||1,img=cv.width?cv.toDataURL():'';cv.width=r.width*d;cv.height=r.height*d;cv.style.width=r.width+'px';cv.style.height=r.height+'px';cx.setTransform(d,0,0,d,0,0);if(img){let im=new Image;im.onload=()=>cx.drawImage(im,0,0,r.width,r.height);im.src=img}}function clearInk(){cx.clearRect(0,0,cv.width,cv.height)}function point(e){let r=board.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}board.addEventListener('pointerdown',e=>{if(e.target.closest('.slot')||e.target.closest('.num'))return;drawing=true;last=point(e);board.setPointerCapture(e.pointerId)});board.addEventListener('pointermove',e=>{if(!drawing)return;let p=point(e);cx.beginPath();cx.moveTo(last.x,last.y);cx.lineTo(p.x,p.y);cx.lineCap='round';cx.lineJoin='round';cx.lineWidth=mode==='eraser'?34:5;cx.strokeStyle='#1971c2';cx.globalCompositeOperation=mode==='eraser'?'destination-out':'source-over';cx.stroke();last=p});board.addEventListener('pointerup',()=>{drawing=false;cx.globalCompositeOperation='source-over'});board.addEventListener('pointercancel',()=>drawing=false);function setMode(m){mode=m;$('#pen').classList.toggle('on',m==='pen');$('#eraser').classList.toggle('on',m==='eraser')}$('#pen').onclick=()=>setMode('pen');$('#eraser').onclick=()=>setMode('eraser');$('#clear').onclick=clearInk;window.addEventListener('resize',()=>{if(game.classList.contains('show')){resize();if(level<=2)drawGlow(groups[stage]?.n||[])}});makeDigits();setMode('pen')})();
</script></body></html>
