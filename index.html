<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>2けた×2けた ひっさん</title><style>
*{box-sizing:border-box;touch-action:none;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eaf5ff;font-family:"Hiragino Sans","Yu Gothic",sans-serif;color:#182433}#app{width:100%;height:100%;padding:8px;display:grid;grid-template-columns:minmax(0,1fr) 170px;gap:9px}#board{position:relative;overflow:hidden;background:#fff;border:4px solid #65a9dc;border-radius:20px;box-shadow:0 5px 0 #3775a5}#ink{position:absolute;inset:0;z-index:1;pointer-events:none}#sum{position:absolute;z-index:2;left:50%;top:50%;transform:translate(-50%,-50%);display:grid;grid-template-columns:repeat(4,clamp(70px,10vw,112px));grid-template-rows:repeat(7,clamp(52px,10vh,78px));align-items:center;justify-items:center;font-size:clamp(48px,7.5vw,78px);font-weight:800;line-height:1}.cell{position:relative;z-index:2;width:100%;height:100%;display:flex;align-items:center;justify-content:center;border-radius:12px}.num.focus{background:transparent;box-shadow:none}#pairGlow{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:visible}#pairGlow line{stroke:#ffe36e;stroke-width:54;stroke-linecap:round;opacity:.78}.op{font-size:.8em}.bar{width:100%;height:6px;border-radius:5px;background:#182433;align-self:end}.slot{width:90%;height:88%;background:#fff;border:4px solid #a9d8f5;border-radius:10px;box-shadow:inset 0 2px 4px #d9e7ef;color:#182433;font-size:.88em;line-height:1;overflow:visible}.slot.active{background:#fff3a5;border-color:#ff9f1c;animation:pulse .8s alternate infinite}.slot.done{background:#e7f9ed;border-color:#51a86b}.slot.wrong{animation:shake .25s}@keyframes pulse{to{transform:scale(1.05);box-shadow:0 0 0 8px #ffd43b44}}@keyframes shake{25%{transform:translateX(-12px)}75%{transform:translateX(12px)}}#side{z-index:5;background:#f8fcff;border:4px solid #65a9dc;border-radius:20px;box-shadow:0 5px 0 #3775a5;padding:9px;display:flex;flex-direction:column;align-items:center;gap:8px}#progress{font-size:25px;font-weight:900}#digits{display:grid;grid-template-columns:repeat(2,62px);gap:7px}.digit{width:62px;height:48px;border:2px solid #9bc6e4;border-radius:11px;background:#fff;font-size:33px;font-weight:900;color:#182433;box-shadow:0 4px 0 #789db7}.digit:active{transform:translateY(3px);box-shadow:0 1px 0 #789db7}#tools{margin-top:auto;width:100%;display:grid;grid-template-columns:1fr 1fr;gap:8px}.tool{height:52px;border:0;border-radius:12px;background:#dcecf7;font-size:25px;font-weight:900;box-shadow:0 4px 0 #92adbf}.tool.on{background:#ffd43b;box-shadow:0 4px 0 #dfad00}#clear{grid-column:1/3}#ghost{display:none;position:fixed;z-index:50;width:68px;height:68px;transform:translate(-50%,-50%);align-items:center;justify-content:center;border-radius:50%;background:#fff8bd;border:4px solid #ff9f1c;font-size:45px;font-weight:900;pointer-events:none;box-shadow:0 7px 16px #0004}#mark,#finish{display:none;position:absolute;inset:0;z-index:40;align-items:center;justify-content:center;background:#ffffffc9}#mark{font-size:min(44vw,44vh);font-weight:900;color:#ef233c}#finish{flex-direction:column;background:linear-gradient(135deg,#fff5bd,#d9faff);font-size:min(17vw,20vh);font-weight:900;color:#ef233c}.confetti{position:absolute;width:17px;height:17px;border-radius:3px;animation:fall 1.8s linear infinite}@keyframes fall{from{transform:translateY(-20vh) rotate(0)}to{transform:translateY(120vh) rotate(500deg)}}@media(max-width:720px){#app{grid-template-columns:minmax(0,1fr) 145px;padding:5px;gap:6px}#side{padding:6px}#digits{grid-template-columns:repeat(2,54px)}.digit{width:54px;height:42px;font-size:29px}#sum{grid-template-columns:repeat(4,62px);font-size:43px}}
</style></head><body><div id="app"><main id="board"><canvas id="ink"></canvas><div id="sum"></div></main><aside id="side"><div id="progress">1 / 5</div><div id="digits"></div><div id="tools"><button id="pen" class="tool on" type="button" aria-label="えんぴつ">✏️</button><button id="eraser" class="tool" type="button" aria-label="けしごむ">▱</button><button id="clear" class="tool" type="button" aria-label="ぜんぶけす">↶</button></div></aside><div id="ghost"></div><div id="mark">◎</div><div id="finish">クリア！</div></div><script>
(()=>{const $=s=>document.querySelector(s),board=$('#board'),sum=$('#sum'),cv=$('#ink'),cx=cv.getContext('2d'),ghost=$('#ghost');
const pool=[[21,14],[23,12],[31,13],[32,21],[41,12],[22,13],[24,12],[33,21],[42,13],[51,12],[61,13],[71,12],[81,11],[43,21],[52,13]].filter(x=>{let a=x[0],b=x[1],ds=[Math.floor(a/10),a%10],es=[Math.floor(b/10),b%10];return a*b>=100&&a*b<=999&&ds.every(d=>es.every(e=>d*e<=9))});const questions=[...pool].sort(()=>Math.random()-.5).slice(0,5);let qi=0,stage=0,slots=[],groups=[],mode='pen',drawing=false,last=null,drag=null;
function add(c,r,t='',cl='cell'){let e=document.createElement('div');e.className=cl;e.style.gridColumn=c;e.style.gridRow=r;e.textContent=t;sum.appendChild(e);return e}function sl(c,r,a){let e=add(c,r,'','cell slot');e.dataset.answer=a;slots.push(e);return e}
function build(){stage=0;slots=[];groups=[];sum.innerHTML='';let[a,b]=questions[qi],A=[Math.floor(a/10),a%10],B=[Math.floor(b/10),b%10],ans=String(a*b).padStart(3,'0').split('');let at=add(3,1,A[0],'cell num'),ao=add(4,1,A[1],'cell num'),bt=add(3,2,B[0],'cell num'),bo=add(4,2,B[1],'cell num');add(2,2,'×','cell op');let bar1=add(1,3,'','bar');bar1.style.gridColumn='1/5';let p11=sl(4,4,A[1]*B[1]),p12=sl(3,4,A[0]*B[1]),p21=sl(3,5,A[1]*B[0]),p22=sl(2,5,A[0]*B[0]);let bar2=add(1,6,'','bar');bar2.style.gridColumn='1/5';let f1=sl(2,7,ans[0]),f2=sl(3,7,ans[1]),f3=sl(4,7,ans[2]);groups=[{s:[p11],n:[ao,bo]},{s:[p12],n:[at,bo]},{s:[p21],n:[ao,bt]},{s:[p22],n:[at,bt]},{s:[f1,f2,f3],n:[]}];activate();$('#progress').textContent=`${qi+1} / 5`;clearInk();resize()}
function activate(){document.querySelectorAll('.active,.focus').forEach(e=>e.classList.remove('active','focus'));groups[stage].s.filter(e=>!e.classList.contains('done')).forEach(e=>e.classList.add('active'));groups[stage].n.forEach(e=>e.classList.add('focus'));drawPairGlow()}function drawPairGlow(){let old=$('#pairGlow');if(old)old.remove();let ns=groups[stage]?.n||[];if(ns.length<2)return;let sr=sum.getBoundingClientRect(),a=ns[0].getBoundingClientRect(),b=ns[1].getBoundingClientRect();let svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.id='pairGlow';svg.setAttribute('width',sr.width);svg.setAttribute('height',sr.height);svg.setAttribute('viewBox',`0 0 ${sr.width} ${sr.height}`);let line=document.createElementNS('http://www.w3.org/2000/svg','line');line.setAttribute('x1',a.left-sr.left+a.width/2);line.setAttribute('y1',a.top-sr.top+a.height/2);line.setAttribute('x2',b.left-sr.left+b.width/2);line.setAttribute('y2',b.top-sr.top+b.height/2);svg.appendChild(line);sum.prepend(svg)}
function makeDigits(){for(let i=0;i<10;i++){let b=document.createElement('button');b.type='button';b.className='digit';b.textContent=i;b.dataset.n=i;b.addEventListener('pointerdown',startDrag);$('#digits').appendChild(b)}}
function startDrag(e){drag=e.currentTarget.dataset.n;ghost.textContent=drag;ghost.style.display='flex';moveDrag(e);e.currentTarget.setPointerCapture?.(e.pointerId);e.currentTarget.addEventListener('pointermove',moveDrag);e.currentTarget.addEventListener('pointerup',dropDrag,{once:true});e.currentTarget.addEventListener('pointercancel',dropDrag,{once:true})}
function moveDrag(e){ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px'}
function dropDrag(e){e.currentTarget.removeEventListener('pointermove',moveDrag);ghost.style.display='none';let t=document.elementFromPoint(e.clientX,e.clientY)?.closest('.slot'),g=groups[stage];if(t&&g.s.includes(t)&&!t.classList.contains('done')){t.textContent=drag;if(t.dataset.answer===drag){t.classList.add('done');t.classList.remove('active','wrong');if(g.s.every(x=>x.classList.contains('done'))){stage++;if(stage===groups.length)complete();else activate()}else activate()}else{t.classList.remove('wrong');void t.offsetWidth;t.classList.add('wrong');setTimeout(()=>{t.textContent='';t.classList.remove('wrong')},320)}}drag=null}
function complete(){document.querySelectorAll('.focus').forEach(e=>e.classList.remove('focus'));$('#pairGlow')?.remove();$('#mark').style.display='flex';setTimeout(()=>{$('#mark').style.display='none';qi++;qi===5?finish():build()},1050)}function finish(){let f=$('#finish');f.style.display='flex';for(let i=0;i<34;i++){let c=document.createElement('i');c.className='confetti';c.style.left=Math.random()*100+'%';c.style.top=-Math.random()*70+'%';c.style.background=['#ff4d6d','#ffd43b','#20c997','#339af0','#845ef7'][i%5];c.style.animationDelay=Math.random()*1.5+'s';f.appendChild(c)}}
function resize(){let r=board.getBoundingClientRect(),d=devicePixelRatio||1,img=cv.width?cv.toDataURL():'';cv.width=r.width*d;cv.height=r.height*d;cv.style.width=r.width+'px';cv.style.height=r.height+'px';cx.setTransform(d,0,0,d,0,0);if(img){let im=new Image;im.onload=()=>cx.drawImage(im,0,0,r.width,r.height);im.src=img}}function clearInk(){cx.clearRect(0,0,cv.width,cv.height)}function pt(e){let r=board.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
board.addEventListener('pointerdown',e=>{if(e.target.closest('.slot')||e.target.closest('.num'))return;drawing=true;last=pt(e);board.setPointerCapture(e.pointerId)});board.addEventListener('pointermove',e=>{if(!drawing)return;let p=pt(e);cx.beginPath();cx.moveTo(last.x,last.y);cx.lineTo(p.x,p.y);cx.lineCap='round';cx.lineJoin='round';cx.lineWidth=mode==='eraser'?34:5;cx.strokeStyle='#1971c2';cx.globalCompositeOperation=mode==='eraser'?'destination-out':'source-over';cx.stroke();last=p});board.addEventListener('pointerup',()=>{drawing=false;cx.globalCompositeOperation='source-over'});board.addEventListener('pointercancel',()=>drawing=false);
function setMode(m){mode=m;$('#pen').classList.toggle('on',m==='pen');$('#eraser').classList.toggle('on',m==='eraser')}$('#pen').onclick=()=>setMode('pen');$('#eraser').onclick=()=>setMode('eraser');$('#clear').onclick=clearInk;window.addEventListener('resize',()=>{resize();drawPairGlow()});makeDigits();build();setMode('pen')})();
</script></body></html>
